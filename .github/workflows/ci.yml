name: CI

on:
  push:
    branches: [main]
  pull_request:
  # smoke-live gates on `workflow_dispatch`, so the trigger has to be declared
  # here or that job can never run. Weekly schedule catches upstream API drift
  # (NHANES file moves, GTEx v2 changes, mygene.info field renames) before a
  # user hits it.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The `ui` extra is not optional for CI. tests/test_dashboard.py opens
          # with `pytest.importorskip("streamlit")`, so installing only [dev]
          # silently skips all ten AppTest cases — the ones that would have
          # caught the three UI bugs in HANDOFF.md §6 (#9, #10, #11). A skipped
          # guard is a guard that is not there.
          pip install -e ".[dev,ui]"
      - name: Lint (ruff)
        run: ruff check geroquery tests
      - name: Format check (black)
        run: black --check geroquery tests
      - name: Type check (mypy)
        run: mypy geroquery
      - name: Tests
        run: pytest --cov=geroquery --cov-report=term-missing

  # The MCP binding, installed *beside* the API rather than on its own. That is
  # the point of the job: the `mcp` extra pulls starlette, the API pins FastAPI,
  # and the two resolved to an incompatible pair for months without anything
  # noticing, because no environment had ever contained both.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - name: The API still imports with the MCP extra installed
        run: python -c "import geroquery.api.app, geroquery.mcp.server"
      - name: Transport round-trip
        run: pytest tests/test_mcp_transport.py -q

  # The front end has produced four silent failures that a green Python suite
  # did not catch (HANDOFF.md §6, bugs #9, #10, #17, #18). Playwright runs
  # against the built `dist` — the same bytes the CDN serves — because two of
  # those four were defects in the exported data rather than in the components,
  # and no unit test can see them.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `frontend/public/data/` is committed, so this needs no Python ETL.
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Live upstream smoke tests + full ETL run OFF the PR path (avoids
  # rate-limiting GEO/GTEx/mygene.info). Manual or scheduled only.
  smoke-live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # biolearn is installed here, not in the matrix job: it is optional, slow
      # to build, and unavailable on some Python versions. This is the job where
      # the real-clock wrappers actually get exercised.
      - run: pip install -e ".[dev,clocks]"
      - name: Live smoke tests (real upstreams + real clocks)
        env:
          GEROQUERY_ALLOW_NETWORK: "1"
        run: pytest -m live -q
