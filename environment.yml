# One-command reproducible environment (Conda/Bioconda).
#   conda env create -f environment.yml && conda activate geroquery
#
# Installs the package with the `dev` and `ui` extras, the same set CI uses, so
# `make ci` (pytest-cov, pyyaml, streamlit) works in this environment.
name: geroquery
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - pyarrow>=14
  - duckdb>=0.10
  - fastapi>=0.110
  - pydantic>=2.5
  - uvicorn>=0.27
  - httpx>=0.26
  - streamlit>=1.30
  - plotly>=5.18
  - pip
  - pip:
      - -e .[dev,ui]
