# One-command reproducible environment (Conda/Bioconda).
#   conda env create -f environment.yml && conda activate geroquery
#
# The R/Bioconductor packages are ONLY used by the offline ETL bridge
# (recount3, GEOquery, gtexr) — never on the API request path.
name: geroquery
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - pyarrow>=14
  - duckdb>=0.10
  - fastapi>=0.110
  - pydantic>=2.5
  - uvicorn>=0.27
  - httpx>=0.26
  - streamlit>=1.30
  - plotly>=5.18
  - pytest>=7.4
  - ruff>=0.3
  - black>=24.1
  - mypy>=1.8
  # ETL bridge only (optional, heavy): uncomment to enable live recount3/GEO ingestion
  # - bioconductor-recount3
  # - bioconductor-geoquery
  # - r-base>=4.3
  # - rpy2>=3.5
  - pip
  - pip:
      - -e .
