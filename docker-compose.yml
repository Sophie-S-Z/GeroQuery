services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GEROQUERY_DATA_HOME: /data
    volumes:
      - geroquery-data:/data

  dashboard:
    build: .
    command: >
      sh -c "pip install --no-cache-dir streamlit plotly &&
             streamlit run geroquery/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  geroquery-data:
