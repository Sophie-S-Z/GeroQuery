[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geroquery"
version = "1.0.0"
description = "Open-source multi-omic & clinical aging data aggregator with a dynamical-systems resilience layer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Praneel" }]
requires-python = ">=3.10"
keywords = ["aging", "longevity", "bioinformatics", "multi-omics", "aging-clocks", "resilience"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "duckdb>=0.10",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "httpx>=0.26",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "black>=24.1", "mypy>=1.8"]
# R/Bioconductor bridge (recount3/GEOquery/gtexr) is used only by offline ETL.
rbridge = ["rpy2>=3.5"]

[project.urls]
Homepage = "https://github.com/praneel/geroquery"
Repository = "https://github.com/praneel/geroquery"

[project.scripts]
geroquery-etl = "geroquery.etl.build_fixtures:build_all"

[tool.setuptools.packages.find]
include = ["geroquery*"]

[tool.setuptools.package-data]
geroquery = ["idmap/data/*.json", "sources/data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function-call defaults (Query(...)) by design

[tool.ruff.lint.per-file-ignores]
# These files are dominated by long human-readable content strings (curated
# prose and inline HTML for the dashboard); wrapping them hurts readability.
"geroquery/ui/streamlit_app.py" = ["E501"]
"geroquery/knowledge/aging_knowledge.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
