[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geroquery"
version = "1.0.0"
description = "Open-source multi-omic & clinical aging data aggregator with a dynamical-systems resilience layer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Praneel" }]
requires-python = ">=3.10"
keywords = ["aging", "longevity", "bioinformatics", "multi-omics", "aging-clocks", "resilience"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=14",
  "duckdb>=0.10",
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "httpx>=0.26",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18"]
# pyyaml is a test dependency, not a runtime one: tests/test_panel_diff.py
# parses the living-evidence workflow to assert it can never auto-merge.
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "black>=24.1", "mypy>=1.8", "pyyaml>=6.0"]
# Real published aging clocks (Horvath, Hannum, PhenoAge, GrimAge, DunedinPACE).
# Optional: the registry falls back to the transparent reference clocks without
# it and reports why via ClockRegistry.library_status.
#
# The extra pins more than biolearn itself, because biolearn 0.9.1 under-declares:
#   torch, seaborn  — imported at module scope in biolearn.model but absent from
#                     its install_requires, so `import biolearn.model_gallery`
#                     dies with ModuleNotFoundError on a clean install.
#   pandas<3        — DunedinPACE's quantile normalization writes into the
#                     DataFrame's numpy buffer, which pandas 3's mandatory
#                     copy-on-write makes read-only ("assignment destination is
#                     read-only"). Nothing outside biolearn can work around it.
# Also note `ecos` (transitive) has no wheel for Python 3.14 — use 3.10-3.12.
clocks = [
  "biolearn>=0.9",
  "pyaging>=0.3",
  "torch>=2.0",
  "seaborn>=0.12",
  "pandas>=2.0,<3",
]
# Model Context Protocol server, so an agent can call GeroQuery as a tool.
# Optional: `geroquery.mcp.tools` (the payload shaping, and the part with logic
# worth testing) imports no SDK, so the suite runs without this extra.
# Upper-bounded on purpose. `mcp` 2.x requires starlette >= 1.0, which FastAPI
# 0.115 cannot use — so an unbounded `pip install -e ".[dev,mcp]"` silently
# upgrades starlette and every API import then dies on
# `Router.__init__() got an unexpected keyword argument 'on_startup'`. Nobody hit
# it because nothing had ever installed this extra beside the API. The `mcp` CI
# job installs both together so it cannot go unnoticed again. Lifting the cap
# means moving FastAPI forward in the same change.
mcp = ["mcp>=1.2,<2", "anyio>=4.0"]
# R/Bioconductor bridge (recount3/GEOquery/gtexr) is used only by offline ETL.
rbridge = ["rpy2>=3.5"]

[project.urls]
Homepage = "https://github.com/praneel/geroquery"
Repository = "https://github.com/praneel/geroquery"

[project.scripts]
geroquery-etl = "geroquery.etl.build_fixtures:build_all"
geroquery-mcp = "geroquery.mcp.server:main"

[tool.setuptools.packages.find]
include = ["geroquery*"]

[tool.setuptools.package-data]
geroquery = ["idmap/data/*.json", "sources/data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function-call defaults (Query(...)) by design

[tool.ruff.lint.per-file-ignores]
# The dashboard is mostly long prose and inline CSS inside string literals.
# Mechanically wrapping those is how you corrupt an f-string; the rule buys
# nothing in a presentation module, so it is switched off here rather than
# worked around line by line.
"geroquery/ui/streamlit_app.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# `python_version` is deliberately NOT set. Pinning it to "3.10" while running
# mypy under a 3.12 interpreter is incoherent: numpy 2.5 requires Python >=3.12
# and its stubs use PEP 695 `type` statements, which mypy refuses to parse when
# told to assume 3.10 —
#
#     numpy/__init__.pyi: error: Type statement is only supported in Python 3.12
#     and greater  [syntax]
#
# and that single syntax error aborts the whole run, so *nothing* got checked.
# This was silent because 3.10 and 3.11 resolve an older numpy whose stubs parse
# fine; only the 3.12 matrix job and modern local venvs hit it.
#
# Unset, mypy assumes the running interpreter. Each CI matrix job then checks
# that version's semantics against that version's actual dependency set, which
# is what we want anyway — the 3.10 job is the thing that proves 3.10 support,
# not a flag on a 3.12 run. Ruff's `target-version = "py310"` plus the UP rules
# catch newer syntax at lint time regardless of which interpreter runs mypy.
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit real upstreams; excluded from the default run so the suite stays
# hermetic and does not rate-limit CDC/GTEx/mygene.info on every commit. The
# smoke-live CI job runs them on a schedule with `-m live`.
addopts = "-q -m 'not live'"
markers = [
  "live: requires network access to a real upstream (excluded by default)",
]
