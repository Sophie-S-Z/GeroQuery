# Local hooks: they run the ruff, black and mypy installed by `make dev`, so a
# commit is checked by the same versions as `make ci` and CI, not by pinned
# copies that drift from them.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy geroquery
        language: system
        types: [python]
        pass_filenames: false
